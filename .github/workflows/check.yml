# 在 Linux 上验证锁定环境、公共运行层测试与包构建。
name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Python
        run: uv python install
      - name: Restore locked development and tracking dependencies
        run: uv sync --locked --extra tracking
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test runtime behavior
        run: uv run --locked pytest
      - name: Import package structure and optional tracking client
        run: >-
          uv run --locked --extra tracking python -c
          "from reladdr import tasks, models, interventions, mechanisms, evaluation, search;
          import mlflow; print('Package imports and MLflow client import succeeded')"
      - name: Build source distribution and wheel
        run: uv build
