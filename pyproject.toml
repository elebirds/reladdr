# 定义 RelAddr 的项目依赖、构建方式与开发检查。
[project]
name = "reladdr"
version = "0.1.0"
description = "Mechanistic research on relation-conditioned visual addressing in vision-language models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==11.3.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
reladdr = "reladdr.cli:main"

[project.optional-dependencies]
tracking = ["mlflow-skinny>=3.17,<4"]
oss = [
    "boto3>=1.40,<2",
]
gpu = [
    "accelerate==1.11.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.10"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
